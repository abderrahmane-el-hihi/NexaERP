name: CI

on:
  push:
    branches: [main, "hardening/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexaerp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Migrations run as the owner; the app and the tests run as the restricted role
      # created by the RLS migration, so row level security is exercised for real.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexaerp_test
      TEST_DATABASE_URL: postgresql://nexaerp_app:nexaerp_app@localhost:5432/nexaerp_test
      EINVOICE_ENABLED: "true"
      EINVOICE_PROVIDER: SANDBOX
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests (invariants, engines, flows)
        run: npm test

      - name: Production build
        run: npm run build
